seed: 1337

model:
  vocab_size: 8192
  # Same ~100.7M architecture as configs/zenith_kaggle.yaml (16 layers x dim 768).
  dim: 768
  n_layers: 16
  n_heads: 12
  n_kv_heads: 4
  hidden_dim: 2048
  max_seq_len: 512
  rope_theta: 10000.0
  dropout: 0.0
  tie_embeddings: true

data:
  # Persisted on Google Drive (not the ephemeral Colab local disk) so the data
  # pipeline doesn't have to re-run every session — see colab/zenith_colab_train.ipynb.
  train_path: /content/drive/MyDrive/zenith_ai/data/train_packed.npy
  val_path: /content/drive/MyDrive/zenith_ai/data/val_packed.npy

training:
  micro_batch_size: 16
  grad_accum_steps: 8
  # Same step budget logic as the Kaggle config: size total_steps to the
  # throughput actually measured on the free GPU you land on, not an assumed
  # best case. Adjust after the first ~200 steps report a tok/s figure.
  total_steps: 1000
  warmup_steps: 200
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  # Also on Drive — survives a disconnected/recycled Colab runtime, unlike
  # Kaggle's /kaggle/working which needs the dataset-reattach dance to resume.
  checkpoint_dir: /content/drive/MyDrive/zenith_ai/checkpoints
  checkpoint_every: 250
  eval_every: 200
  log_every: 20
